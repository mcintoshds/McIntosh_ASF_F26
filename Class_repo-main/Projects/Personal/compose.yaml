services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: idontknow
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe123
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - recipe_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_user -d idontknow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recipe_data:
